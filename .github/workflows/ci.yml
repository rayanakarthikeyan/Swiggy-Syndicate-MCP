name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20x
        uses: actions/setup-node@v4
        with:
          node-version: 20x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run demo
